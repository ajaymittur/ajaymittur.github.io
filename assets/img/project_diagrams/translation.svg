<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">English to French Machine Translation</title>
<desc id="desc">Flow diagram comparing neural translation architectures and Llama 2 QLoRA fine-tuning.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#48c7d9"/></marker></defs>
